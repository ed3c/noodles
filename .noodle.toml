# constraint: Supervised is a machine containment point, not a Human Verifier requirement.
# constraint: ./noodles reconcile releases it only after GitHub exact-head merge/closure readback.
mode = "supervised"

[routing.defaults]
provider = "codex"
model = "gpt-5.6-luna"

[concurrency]
max_concurrency = 4

[runtime.process]
max_concurrent = 4

[server]
enabled = true
port = 3210

[skills]
paths = [
  ".agents/skills",
  ".noodle/providers/cursor-pstack/pstack/skills",
  ".noodle/providers/skill-concerns/skills/control-noodle"
]

[agents.codex]
path = ".agents/bin"
args = ["--ignore-user-config", "-c", "approval_policy=\"never\"", "-c", "default_permissions=\"noodles-cook\"", "-c", "permissions.noodles-cook.extends=\":workspace\"", "-c", "permissions.noodles-cook.workspace_roots={\"/Users/neon/noodles/.git\"=true,\"/Users/neon/noodles/.noodle/sessions\"=true}", "-c", "permissions.noodles-cook.filesystem={\":workspace_roots\"={\".agents/skills\"=\"write\"}}", "-c", "permissions.noodles-cook.network.enabled=true"]

[adapters.backlog]
skill = "schedule"

[adapters.backlog.scripts]
sync = ".noodle/adapters/github sync"
add = ".noodle/adapters/github add"
edit = ".noodle/adapters/github edit"
done = ".noodle/adapters/github done"
