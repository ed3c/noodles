name: land

on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: land-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  land:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact verify receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noodles-receipt
          path: receipt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Mint protection-read GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.NOODLES_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOODLES_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - name: Exact-head merge and Issue closure readback
        env:
          GH_TOKEN: ${{ github.token }}
          NOODLES_GITHUB_PROTECTION_TOKEN: ${{ steps.app-token.outputs.token }}
          NOODLES_REQUIRE_PROTECTION_READ_TOKEN: '1'
        run: >-
          python3 noodles.py github land
          --event "$GITHUB_EVENT_PATH"
          --receipt "$GITHUB_WORKSPACE/receipt/noodles-receipt.json"
