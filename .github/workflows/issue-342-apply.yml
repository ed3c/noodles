name: issue-342 bounded apply

on:
  push:
    branches: [issue-342-parallel-verify]

permissions:
  contents: write

concurrency:
  group: issue-342-bounded-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact implementation branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue-342-parallel-verify
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact bounded topology change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/verify.yml')
          workflow = workflow_path.read_text()
          old = "  verify:\n    needs: candidate-self-tests\n"
          new = "  verify:\n"
          if workflow.count(old) != 1:
              raise SystemExit(f"verify.yml serial edge occurrence != 1: {workflow.count(old)}")
          workflow_path.write_text(workflow.replace(old, new, 1))

          protection_path = Path('github_protection.py')
          protection = protection_path.read_text()
          old = '(trusted_verify_job.get("needs"), ["candidate-self-tests"], "trusted verify job must depend only on candidate-self-tests")'
          new = '(trusted_verify_job.get("needs"), [], "trusted verify job must stay independent of candidate-self-tests")'
          if protection.count(old) != 1:
              raise SystemExit(f"github_protection serial invariant occurrence != 1: {protection.count(old)}")
          protection_path.write_text(protection.replace(old, new, 1))

          test_path = Path('tests/test_noodles.py')
          tests = test_path.read_text()
          start_marker = '    def test_trusted_verify_requires_candidate_job_dependency(self) -> None:\n'
          end_marker = '    def test_trusted_verify_rejects_candidate_script_execution(self) -> None:\n'
          if tests.count(start_marker) != 1 or tests.count(end_marker) != 1:
              raise SystemExit('trusted verify dependency test boundary is not unique')
          start = tests.index(start_marker)
          end = tests.index(end_marker, start)
          replacement = '''    def test_trusted_verify_rejects_serial_candidate_dependency(self) -> None:\n        temp, root = self.mutated_copy()\n        self.addCleanup(temp.cleanup)\n        path = root / ".github/workflows/verify.yml"\n        workflow = path.read_text()\n        verify_job = "  verify:\\n"\n        dependency = "    needs: candidate-self-tests\\n"\n        self.assertIn(verify_job, workflow)\n        self.assertNotIn(dependency, workflow)\n        path.write_text(workflow.replace(verify_job, verify_job + dependency, 1))\n        self.commit(root)\n        result = self.verify(root)\n        self.assertFalse(result["ok"])\n        self.assertIn("trusted verify job must stay independent of candidate-self-tests", result["errors"])\n\n'''
          test_path.write_text(tests[:start] + replacement + tests[end:])
          PY
          git rm .github/workflows/issue-342-apply.yml

      - name: Run repository deterministic suite
        id: deterministic-suite
        shell: bash
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: |
          set -o pipefail
          tests/run.sh 2>&1 | tee issue-342-tests.log

      - name: Upload deterministic suite receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-342-tests-${{ github.run_id }}
          path: issue-342-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Run repository verify
        shell: bash
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: |
          set -euo pipefail
          ./noodles verify

      - name: Run trusted preview
        shell: bash
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: |
          set -euo pipefail
          ./noodles verify --trusted-preview

      - name: Assert bounded diff and zero generated residue
        shell: bash
        run: |
          set -euo pipefail
          rm -f issue-342-tests.log
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/issue-342-apply.yml',
              '.github/workflows/verify.yml',
              'github_protection.py',
              'tests/test_noodles.py',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          observed = {line[3:] for line in out.splitlines() if line}
          if observed != expected:
              raise SystemExit(f'unexpected repository residue: observed={sorted(observed)} expected={sorted(expected)}')
          print('bounded-diff PASS', sorted(observed))
          PY

      - name: Commit verified implementation and self-delete harness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(#342): parallelize trusted verification jobs'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:issue-342-parallel-verify
