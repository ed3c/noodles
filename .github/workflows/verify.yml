name: verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate-self-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run candidate self-tests
        working-directory: .candidate
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: tests/run.sh

      - name: Run candidate self-tests with a differing candidate root
        working-directory: .candidate
        env:
          NOODLES_OFFLINE_TESTS: '1'
          # A copy of the candidate as data makes candidate != engine without
          # importing any trusted bytes, so a trusted assertion coupled to the
          # candidate root that the candidate's own production does not honor
          # reds here, in the candidate's own self-tests, before merge.
          NOODLES_CANDIDATE_ROOT: ${{ github.workspace }}/.candidate-copy
        run: |
          cp -a "$GITHUB_WORKSPACE/.candidate" "$GITHUB_WORKSPACE/.candidate-copy"
          python3 -m unittest discover -s tests -v

  verify:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted verifier from default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate head as data without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # ed3c/noodles#413: the trusted job's lint toolchain, installed at the version the TRUSTED
      # policy pins and read out of that same file rather than restated here. No dependency manifest
      # exists by design, so the pin lives in policy/ruff.toml and ruff's own `required-version`
      # refuses to run under any other version. The candidate's copy of this file is never consulted:
      # this step and the gate both name .trusted.
      - name: Install the pinned lint toolchain from trusted policy
        run: >-
          python3 -m pip install --quiet --disable-pip-version-check
          "ruff$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["required-version"])' .trusted/policy/ruff.toml)"

      # ed3c/noodles#415: the trusted job's type checker, on the same terms as the lint toolchain
      # above and read out of the TRUSTED baseline the gate judges against, so the installed version
      # and the frozen counts can never come from different files. basedpyright has no
      # `required-version` of its own, so `type_gate_errors` refuses a mismatch itself rather than
      # trusting this step to have installed what it said.
      - name: Install the pinned type toolchain from trusted policy
        run: >-
          python3 -m pip install --quiet --disable-pip-version-check
          "basedpyright==$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["tool"]["version"])' .trusted/policy/basedpyright-baseline.json)"

      - name: Run trusted positive and planted-negative controls
        env:
          NOODLES_CANDIDATE_ROOT: ${{ github.workspace }}/.candidate
          PYTHONPATH: ${{ github.workspace }}/.trusted
          NOODLES_OFFLINE_TESTS: '1'
        run: python3 -m unittest discover -s .trusted/tests -v

      - name: Produce exact-head trusted receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .trusted/noodles.py github verify-pr
          --event "$GITHUB_EVENT_PATH"
          --candidate "$GITHUB_WORKSPACE/.candidate"
          --receipt "$GITHUB_WORKSPACE/noodles-receipt.json"

      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noodles-receipt
          path: noodles-receipt.json
          if-no-files-found: error
          retention-days: 7
