name: issue-344 hosted test-oracle transition

on:
  push:
    branches: [issue-344-stage-topology-test]

permissions:
  contents: write

concurrency:
  group: issue-344-hosted-transition
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact transition branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue-344-stage-topology-test
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply test-only staged acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_noodles.py')
          text = path.read_text()
          start_marker = '    def test_trusted_verify_requires_candidate_job_dependency(self) -> None:\n'
          end_marker = '    def test_trusted_verify_rejects_candidate_script_execution(self) -> None:\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('trusted verify dependency test boundary is not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    def test_trusted_verify_rejects_unadmitted_dependency(self) -> None:\n        temp, root = self.mutated_copy()\n        self.addCleanup(temp.cleanup)\n        path = root / ".github/workflows/verify.yml"\n        workflow = path.read_text()\n        admitted = "  verify:\\n    needs: candidate-self-tests\\n"\n        planted = "  verify:\\n    needs: foreign-job\\n"\n        self.assertIn(admitted, workflow)\n        path.write_text(workflow.replace(admitted, planted, 1))\n        self.commit(root)\n        result = self.verify(root)\n        self.assertFalse(result["ok"])\n        self.assertTrue(any("trusted verify job" in item for item in result["errors"]), result["errors"])\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git rm .github/workflows/issue-344-apply.yml

      - name: Prove final mutation is test-only before gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {'.github/workflows/issue-344-apply.yml', 'tests/test_noodles.py'}
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          observed = {line[3:] for line in out.splitlines() if line}
          if observed != expected:
              raise SystemExit(f'unexpected staged paths: observed={sorted(observed)} expected={sorted(expected)}')
          PY

      - name: Run complete candidate suite
        shell: bash
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: |
          set -o pipefail
          tests/run.sh 2>&1 | tee issue-344-tests.log

      - name: Upload suite receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-344-tests-${{ github.run_id }}
          path: issue-344-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Run repository verify
        shell: bash
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: |
          set -euo pipefail
          ./noodles verify

      - name: Run trusted preview
        shell: bash
        env:
          NOODLES_OFFLINE_TESTS: '1'
        run: |
          set -euo pipefail
          ./noodles verify --trusted-preview

      - name: Assert exact final diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f issue-344-tests.log
          git diff --check
          python3 - <<'PY'
          import subprocess
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          observed = {line[3:] for line in out.splitlines() if line}
          expected = {'.github/workflows/issue-344-apply.yml', 'tests/test_noodles.py'}
          if observed != expected:
              raise SystemExit(f'unexpected final residue: observed={sorted(observed)} expected={sorted(expected)}')
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          if set(changed) != expected:
              raise SystemExit(f'unexpected diff names: {changed}')
          print('test-only staged transition PASS')
          PY

      - name: Commit verified test-only stage and self-delete harness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(#344): stage verify topology acceptance'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:issue-344-stage-topology-test
